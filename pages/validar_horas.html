<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validar Horas - UniSENAI</title>
    <link rel="stylesheet" href="/css/validar_horas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="header-container">
        <a href="/pages/menu_inicial.html" class="btn-voltar"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
        <div class="logo">
            <span class="logo-uni">UNI</span><span class="logo-senai">SENAI</span>
        </div>
    </header>
    
    <main class="content">
        <div id="toast-container" class="toast-hidden"></div>
        <h1 class="main-title">Validar Horas</h1>

        <section class="section-container">
            <h2 class="section-label">Filtro</h2>
            <div class="filter-box">
                <div class="input-group search-wide">
                    <label>O que você está procurando?</label>
                    <div class="search-wrapper">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="searchInput" placeholder="Pesquise por projeto, curso ou aluno...">
                    </div>
                </div>

                <div class="input-group">
                    <label>Categoria</label>
                    <select id="categorySelect">
                        <option value="Todas">Todas</option>
                        <option value="Curso">Curso</option>
                        <option value="Projeto">Projeto</option>
                        <option value="Aluno">Aluno</option>
                        <option value="Data">Data</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Status</label>
                    <select id="statusSelect">
                        <option value="Todos">Todos</option>
                        <option value="Pendente">Pendente</option>
                        <option value="Aceito">Aceito</option>
                        <option value="Negado">Negado</option>
                    </select>
                </div>

                <button class="btn-pesquisar" id="btnPesquisar">Pesquisar</button>
            </div>
        </section>

        <section class="section-container">
            <h2 class="section-label">Tabela</h2>
            <div class="table-wrapper">
                <table id="hoursTable">
                    <thead>
                        <tr>
                            <th>Curso <i class="fa-solid fa-caret-down"></i></th>
                            <th>Título do Projeto <i class="fa-solid fa-caret-down"></i></th>
                            <th>Aluno <i class="fa-solid fa-caret-down"></i></th>
                            <th>Data <i class="fa-solid fa-caret-down"></i></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>ADS</td>
                            <td>Controle de Horas</td>
                            <td>Débora Fraga Moreira de Sousa</td>
                            <td>01/06/2026</td>
                            <td class="actions">
                                <button class="btn-ok">OK</button>
                                <button class="btn-negue">Negar</button>
                                <button class="btn-info">+ Info</button>
                            </td>
                        </tr>
                        <tr>
                            <td>ADS</td>
                            <td>Projeto Doar</td>
                            <td>Maria da Silva</td>
                            <td>19/11/2025</td>
                            <td class="actions">
                                <button class="btn-ok">OK</button>
                                <button class="btn-negue">Negar</button>
                                <button class="btn-info">+ Info</button>
                            </td>
                        </tr>
                        <tr class="empty-row"><td></td><td></td><td></td><td></td><td></td></tr>
                        <tr class="empty-row"><td></td><td></td><td></td><td></td><td></td></tr>
                        <tr class="empty-row"><td></td><td></td><td></td><td></td><td></td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="/js/validar_horas.js"></script>
</body>
</html>
