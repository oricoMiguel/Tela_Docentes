<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Projeto - UniSENAI</title>
    <link rel="stylesheet" href="../css/cadastro_horas.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../css/side-bar.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">   
</head>
<body>
    <div id="sidebar-container"></div>
    
    <main class="content">
        <div id="toast-container" class="toast-hidden"></div>
        <h1 class="main-title">Cadastro de Projeto - Filtro</h1>

        <section class="section-container">
            <div class="filter-box">

                <!-- Dropdown Curso -->
                <div class="input-group">
                    <label>Curso</label>
                    <select id="courseSelect">
                        <option value="">Selecione o curso</option>
                        <option value="ADS">ADS</option>
                        <option value="Engenharia de Software">Engenharia de Software</option>
                    </select>
                </div>

                <!-- Dropdown Projeto -->
                <div class="input-group">
                    <label>Projeto</label>
                    <select id="projectSelect">
                        <option value="">Selecione o projeto</option>
                        <option value="Controle de Horas">Controle de Horas</option>
                        <option value="Projeto Doar">Projeto Doar</option>
                    </select>
                </div>

                <button class="btn-pesquisar" id="btnBuscar">Buscar</button>
            </div>
        </section>

        <!-- Tabela de Resultados -->
        <section class="section-container">
            <div class="table-wrapper">
                <table id="projectsTable">
                    <thead class="Cabecalho">
                        <tr>
                            <th>Curso <i class="fa-solid fa-caret-down"></i></th>
                            <th>Título do Projeto <i class="fa-solid fa-caret-down"></i></th>
                            <th>Ano / Sem <i class="fa-solid fa-caret-down"></i></th>
                            <th>Horas <i class="fa-solid fa-caret-down"></i></th>
                            <th>Ação</th>
                            <th><button class="btn-novo" id="btnNovo">Novo</button></th>
                        </tr>
                    </thead>
                    <tbody class="dadosTabela">
                        <tr>
                            <td>ADS</td>
                            <td>Controle de Horas</td>
                            <td>2026 - 1º</td>
                            <td>50h</td>
                            <td>
                                <button class="btn-editar">
                                    <i class="material-icons">edit</i> Editar
                                </button>
                                <button class="btn-del">
                                    <i class="material-icons">delete</i> Deletar
                                </button>
                            </td>
                        </tr>
                        <tr>
                            <td>ADS</td>
                            <td>Projeto Doar</td>
                            <td>2025 - 2º</td>
                            <td>30h</td>
                            <td>
                                <button class="btn-editar">
                                    <i class="material-icons">edit</i> Editar
                                </button>
                                <button class="btn-del">
                                    <i class="material-icons">delete</i> Deletar
                                </button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>   

    <script src="../js/cadastro_horas.js"></script>
    <script src="../js/sidebar.js"></script>
</body>
</html>
